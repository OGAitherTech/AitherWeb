<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><meta name="description" content="Aither Web — your fast personal web launchpad."><title>Aither Web</title><link rel="stylesheet" href="style.css"></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">A</div><span>Aither Web</span></div><nav><button class="nav-item active" data-view="home"><span>⌂</span>Home</button><button class="nav-item" data-view="bookmarks"><span>☆</span>Bookmarks</button><button class="nav-item" data-view="history"><span>◷</span>History</button></nav><div class="sidebar-bottom"><button class="nav-item" id="settingsBtn"><span>⚙</span>Settings</button></div></aside><main class="main"><header class="topbar"><div class="browser-controls"><button class="icon-btn menu-btn" id="menuBtn">☰</button><button class="icon-btn desktop-only" id="backBtn" title="Back">‹</button><button class="icon-btn desktop-only" id="forwardBtn" title="Forward">›</button><button class="icon-btn" id="homeBtn" title="Home">⌂</button></div><div class="address-pill"><span class="lock">●</span><input id="addressInput" aria-label="Search or enter address" placeholder="Search Google or enter a URL" autocomplete="off"><button id="clearAddress" title="Clear">×</button><button id="goBtn">Go</button></div><button class="icon-btn" id="themeBtn">◐</button></header><section class="content"><div class="home-view" id="homeView"><div class="hero"><div class="hero-orb"><span>A</span></div><p class="eyebrow">AITHER WEB</p><h1>Where do you want to go?</h1><p class="subtitle">Fast searching. Simple browsing. Built for Aither.</p><form class="search-box" id="searchForm"><span>⌕</span><input id="searchInput" placeholder="Search with Google" autocomplete="off"><button type="submit">Search</button></form><div class="hero-actions"><button id="historyShortcut">Recent history</button><button id="bookmarkShortcut">Bookmarks</button></div></div><div class="quick-section"><div class="section-heading"><div><h2>Quick links</h2><p class="muted">Your favorite places on the web.</p></div><button id="addBookmark">+ Add</button></div><div class="quick-grid" id="quickGrid"></div></div></div><div class="panel-view hidden" id="bookmarksView"><div class="section-heading"><div><h2>Bookmarks</h2><p class="muted">Saved shortcuts stay on this device.</p></div><button id="addBookmark2">+ Add</button></div><div class="bookmark-list" id="bookmarkList"></div></div><div class="panel-view hidden" id="historyView"><div class="section-heading"><div><h2>History</h2><p class="muted">Your recent searches and visits.</p></div><button id="clearHistory">Clear all</button></div><div class="history-list" id="historyList"></div></div></section></main></div><div class="modal hidden" id="settingsModal"><div class="modal-card"><div class="modal-head"><h2>Settings</h2><button class="icon-btn" id="closeSettings">×</button></div><label class="setting"><span><b>Theme</b><small>System, dark, or light.</small></span><select id="themeSelect"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label><label class="setting"><span><b>Search engine</b><small>Google is the default for Aither Web.</small></span><select id="engineSelect"><option value="google">Google</option></select></label><label class="setting toggle-row"><span><b>Open destinations in a new tab</b><small>Keep Aither Web open.</small></span><input type="checkbox" id="newTabToggle"></label><button class="danger" id="resetApp">Reset Aither Web</button></div></div><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
